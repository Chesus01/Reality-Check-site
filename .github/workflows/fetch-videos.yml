name: Fetch Latest YouTube Videos

# Interviews: paste the YouTube playlist id here (the part after list= in the
# playlist link). Leave it empty to keep the built in interview row.
env:
  INTERVIEWS_PLAYLIST_ID: ''

on:
  schedule:
    - cron: '0 */3 * * 1-5'   # every 3 hours on weekdays (UTC)
    - cron: '0 */6 * * 0,6'   # every 6 hours on weekends (UTC)
  workflow_dispatch:          # run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-videos.yml'
      - '.github/scripts/build_site.py'
      - 'watch/index.html'

concurrency:
  group: fetch-videos
  cancel-in-progress: false

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch videos, build the Watch pages and push
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 .github/scripts/build_site.py
            git add data watch index.html sitemap.xml robots.txt
            if git diff --staged --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -q -m "chore: update episodes and Watch pages"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced another update; rebuilding on the latest main (attempt $attempt)"
            sleep $((attempt * 10))
          done
          exit 1
